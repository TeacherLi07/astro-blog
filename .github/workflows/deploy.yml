name: Deploy to blog.teacherli.net

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: blog-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24        # 与本机 node -v 主版本保持一致即可
          cache: npm

      - name: Install dependencies
        run: npm ci               # 有 package-lock.json，用 ci 保证可复现

      - name: Build
        run: npm run build        # 失败则整个 job 中止，不会部署

      - name: Deploy via rsync
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H cloud.teacherli.net >> ~/.ssh/known_hosts 2>/dev/null

          attempt=1
          max_attempts=5
          until rsync -azO --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3" \
            dist/ deploy@cloud.teacherli.net:/var/www/blog/; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::rsync failed after ${attempt} attempts"
              exit 1
            fi
            echo "rsync attempt ${attempt} failed (exit $?), retrying in 10s..."
            attempt=$((attempt + 1))
            sleep 2
          done
          echo "rsync succeeded on attempt ${attempt}"

      - name: Smoke test
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://blog.teacherli.net/) || true
            [ "$code" = "200" ] && echo "OK: 200" && exit 0
            sleep 10
          done
          echo "::error::smoke test failed, last status: ${code:-unknown}"
          exit 1